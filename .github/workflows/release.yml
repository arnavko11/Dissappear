name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (otherwise build and upload artifacts only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-26
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Cache idevice
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-${{ hashFiles('Scripts/fetch-idevice.sh') }}

      - name: Fetch idevice
        run: |
          ./Scripts/fetch-idevice.sh
          test -f Vendor/idevice/include/idevice.h
          test -f Vendor/idevice/ios-arm64/libidevice_ffi.a
          test -f Vendor/idevice/ios-simulator/libidevice_ffi.a

      - name: Build iOS app for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Dissappear.xcodeproj \
            -scheme Dissappear \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Embed iOS build in the companion
        run: |
          set -euo pipefail
          rm -rf payload && mkdir -p payload/Payload
          cp -R "build-ios/Build/Products/Release-iphoneos/Dissappear.app" payload/Payload/
          mkdir -p macOS/Resources
          (cd payload && zip -qry "../macOS/Resources/BundledApp.ipa" Payload)
          ls -lh macOS/Resources/BundledApp.ipa

      - name: Build macOS companion
        run: |
          set -o pipefail
          xcodebuild \
            -project Dissappear.xcodeproj \
            -scheme DissappearCompanion \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-macos \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build iOS app for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Dissappear.xcodeproj \
            -scheme Dissappear \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios-sim \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Sign the companion for local use
        run: |
          set -euo pipefail
          app="build-macos/Build/Products/Release/DissappearCompanion.app"

          # Apple silicon refuses to execute a binary with no signature at all,
          # so an unsigned build cannot launch on the machines this targets.
          # An ad-hoc signature satisfies that; it is not a developer identity
          # and does not make the app notarised.
          #
          # Signed inside-out rather than with --deep: --deep is deprecated and
          # mis-signs nested code, which Gatekeeper then reports as a damaged
          # app (error -47) instead of an unsigned one.
          find "$app/Contents" \
            \( -name "*.dylib" -o -name "*.framework" -o -name "*.appex" -o -name "*.app" \) \
            -depth -print0 2>/dev/null |
            while IFS= read -r -d '' nested; do
              codesign --force --sign - --timestamp=none "$nested"
            done
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"
          echo "::group::Signature"
          codesign -dv --verbose=2 "$app" 2>&1 || true
          echo "::endgroup::"

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # Shipped as an installer package, not just a zip. An app unzipped
          # from a download carries the quarantine flag, and macOS refuses to
          # open a quarantined app that is only ad-hoc signed — the "damaged,
          # move to Trash" dialog, error -47 — with no way past it in the UI.
          # A package installs the app without that flag, so it launches by
          # double-click with no Terminal command first.
          mkdir -p pkgroot/Applications
          cp -R "build-macos/Build/Products/Release/DissappearCompanion.app" pkgroot/Applications/
          pkgbuild \
            --root pkgroot \
            --identifier com.dissappear.companion.pkg \
            --version "${VERSION}" \
            --install-location / \
            "artifacts/DissappearCompanion-${VERSION}-macOS.pkg"

          ditto -c -k --sequesterRsrc --keepParent \
            "build-macos/Build/Products/Release/DissappearCompanion.app" \
            "artifacts/DissappearCompanion-${VERSION}-macOS.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "build-ios-sim/Build/Products/Release-iphonesimulator/Dissappear.app" \
            "artifacts/Dissappear-${VERSION}-iOS-Simulator.zip"

          # Same unsigned device build the companion now embeds, so it can be
          # signed with the user's own Apple Development identity.
          cp macOS/Resources/BundledApp.ipa "artifacts/Dissappear-${VERSION}-iOS-unsigned.ipa"

          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: dissappear-${{ env.VERSION }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf 'Automated build of the Dissappear macOS companion and iOS test app.\n\n'
            printf '| Asset | Contents |\n| --- | --- |\n'
            printf '| `DissappearCompanion-*-macOS.pkg` | **Start here.** macOS companion installer. Double-click it, then open Dissappear Companion from Applications. The installer is unsigned, so on first run macOS asks you to allow it in System Settings ▸ Privacy & Security; no Terminal command is needed. |\n'
            printf '| `DissappearCompanion-*-macOS.zip` | The same app as a plain zip, for anyone who prefers it. Unzipping a download quarantines the app, so this copy needs: xattr -dr com.apple.quarantine DissappearCompanion.app |\n'
            printf '| `Dissappear-*-iOS-Simulator.zip` | iOS app built for the Simulator. Drag it onto a booted simulator to run. |\n'
            printf '| `Dissappear-*-iOS-unsigned.ipa` | iOS device build, unsigned. Install it by signing with your own Apple Development identity; the macOS companion builds, signs and installs it through Xcode tooling. |\n\n'
            printf 'Neither asset is distribution-signed. Device installs go through Apple standard development signing and provisioning.\n'
          } > notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            artifacts/*
