name: Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: DissappearCompanion
            destination: platform=macOS
          - scheme: Dissappear
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Dissappear.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Warning summary
        if: always()
        run: |
          grep -oE "[^ ]+\.swift:[0-9]+:[0-9]+: warning: .*" xcodebuild.log \
            | sed 's|/Users/runner/work/Dissappear/Dissappear/||' \
            | sort -u > warnings.txt || true
          count=$(wc -l < warnings.txt | tr -d ' ')
          # Total includes toolchain warnings; it proves the log was captured
          # so a zero source-warning count cannot be a silent false negative.
          total=$(grep -c "warning:" xcodebuild.log || true)
          lines=$(wc -l < xcodebuild.log | tr -d ' ')
          echo "::group::${{ matrix.scheme }}: $count source warnings ($total warning lines in $lines log lines)"
          cat warnings.txt
          echo "::endgroup::"
          {
            echo "### ${{ matrix.scheme }}: $count source warnings"
            echo "_$total total warning lines across $lines captured log lines._"
            if [ "$count" -gt 0 ]; then
              echo '```'
              cat warnings.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
