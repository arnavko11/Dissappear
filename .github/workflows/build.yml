name: Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: DissappearCompanion
            destination: platform=macOS
          - scheme: Dissappear
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Dissappear.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Warning summary
        if: always()
        run: |
          count=$(grep -c "warning:" xcodebuild.log || true)
          echo "### ${{ matrix.scheme }}: $count compiler warnings" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            grep "warning:" xcodebuild.log | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY"
          fi
